name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 22 * * *" # 06:00 SGT nightly: upstream contract + deployed-app regression
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: IaC - fmt, validate, lint, security scan, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - name: terraform test (mocked AWS provider, offline)
        run: terraform test
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.53.0
      - run: tflint --init && tflint --recursive --format compact
      - name: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/terraform
          framework: terraform
          config_file: infra/terraform/.checkov.yaml

  upstream-contract:
    name: data.gov.sg contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tests/requirements.txt
      - run: pytest tests/contract -m contract
        env:
          DATAGOV_API_KEY: ${{ secrets.DATAGOV_API_KEY }}

  app-regression:
    name: Deployed app - self-tests, API, E2E (dev)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: dev
    env:
      APP_BASE_URL: ${{ vars.APP_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tests/requirements.txt && python -m playwright install --with-deps chromium
      - run: pytest tests/api
      - run: pytest tests/e2e -m e2e --browser chromium --tracing retain-on-failure --output test-results
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: tests/test-results
