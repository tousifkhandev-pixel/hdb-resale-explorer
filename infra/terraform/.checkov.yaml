# Documented, deliberate exceptions only.
skip-check:
  - CKV_AWS_2    # HTTP listener exists solely to 301-redirect to HTTPS
  - CKV_AWS_260  # same: port 80 ingress is redirect-only
  - CKV_AWS_145  # ALB access-log bucket must use SSE-S3 (log delivery does not support SSE-KMS)
  - CKV_AWS_18   # access logging on the access-log bucket itself (would recurse)
  - CKV_AWS_144  # cross-region replication: single-region by data-residency requirement
  - CKV2_AWS_62  # S3 event notifications not required for log bucket
  - CKV2_AWS_28  # WAF is attached via aws_wafv2_web_acl_association (variable-controlled)
  - CKV_AWS_150  # ALB deletion protection is variable-driven: on in prod, off in dev/test for teardown
  - CKV_AWS_353  # Performance Insights is variable-driven: on for SE/EE, unsupported on Express (dev)
  - CKV_AWS_394  # AZs are filtered to regular zones and sliced by az_count, so the set cannot grow
  - CKV_AWS_109  # KMS key policy: "*" means "this key" and the root principal is the AWS-recommended default
  - CKV_AWS_111  # same KMS key policy
  - CKV_AWS_356  # same KMS key policy
  - CKV2_AWS_76  # Log4j rule group is present (CKV_AWS_192 passes); this graph check cannot follow the count-based association
